buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath "com.android.tools.build:gradle:8.9.1"
  }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

// Apply Nitrogen autolinking Gradle script AFTER the android plugin.
apply from: "../nitrogen/generated/android/NitroGodot+autolinking.gradle"

android {
  compileSdk 36
  ndkVersion "27.1.12297006"
  namespace "com.margelo.nitro.godot"

  defaultConfig {
    minSdk 24
    targetSdk 36

    // Godot engine is only built for arm64-v8a. Restrict native ABIs so the
    // linker doesn't try to link the arm64 .so against armeabi-v7a (which
    // would fail with "incompatible with armelf_linux_eabi").
    ndk {
      abiFilters "arm64-v8a"
    }

    externalNativeBuild {
      cmake {
        cppFlags "-std=c++20 -frtti -fexceptions"
        arguments "-DANDROID_STL=c++_shared"
      }
    }
  }

  // Enable prefab so CMake can find_package() dependencies that publish
  // native libraries via AAR prefab packages (fbjni, ReactAndroid, nitro-modules).
  buildFeatures {
    prefab true
    prefabPublishing true
  }

  prefab {
    NitroGodot {
      headers "../cpp"
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
      version "3.22.1"
    }
  }

  buildTypes {
    release {
      minifyEnabled false
    }
    debug {
      minifyEnabled false
    }
  }

  packagingOptions {
    // Do NOT strip libgodot.so — it must land in the APK unmodified
    doNotStrip "*/arm64-v8a/libgodot.so"
    doNotStrip "*/armeabi-v7a/libgodot.so"
    doNotStrip "*/x86/libgodot.so"
    doNotStrip "*/x86_64/libgodot.so"
    pickFirst "**/libgodot.so"
  }

  sourceSets {
    main {
      java.srcDirs += ["src/main/java"]
    }
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  implementation "com.facebook.react:react-android"
  // These provide prefab packages consumed by CMake find_package() 
  implementation "com.facebook.fbjni:fbjni:0.6.0"
  implementation project(":react-native-nitro-modules")
}
